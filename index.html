<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Release Decision System</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<h1>Release Decision System</h1>

		<h2>Search Ticket</h2>
		<form id="searchForm">
			<input type="number" id="searchId" placeholder="Enter ticket ID" />
			<button type="submit" id="searchButton">Search</button><br /><br />
		</form>

		<h2>Add ticket</h2>
		<form id="addForm">
			<input type="text" id="addTitle" placeholder="Enter ticket title" />
			<button type="submit" id="addTicketButton">Add ticket</button><br /><br />
		</form>

		<h2>Tickets</h2>
		<h3>Filter</h3>
		<div id="filterButtons">
			<button id="allFilter">All tickets</button>
			<button id="openFilter">Open</button>
			<button id="testingFilter">Testing</button>
			<button id="doneFilter">Done</button>
			<button id="blockerFilter">Release Blocker</button>
			<button id="priorityFilter">Priority</button>
			<button id="unassignedFilter">Unassigned</button>
			<button id="activeFilter">Active</button>
			<button id="blockedFilter">Blocked</button>
		</div>
		<h3>Sort</h3>
		<div id="sortButtons">
			<button id="idSort">ID</button>
			<button id="severitySort">Severity</button>
			<button id="alphabeticalSort">Alphabetically</button>
			<button id="hoursSort">Remaining Hours</button>
		</div>
		<div id="ticketList"></div>

		<div id="ticketDetails" hidden></div>

		<div id="releaseAnalysis"></div>

		<script src="script.js"></script>
	</body>
</html>
